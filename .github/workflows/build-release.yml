name: Build and release Whisky Libraries and Linux Wine

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      libraries_only:
        description: 'Legacy released-core packaging check only; does not build or verify current FFmpeg codecs'
        type: boolean
        default: false
      linux_only:
        description: 'Build the Linux runtime only'
        type: boolean
        default: false
      compile_only:
        description: 'With linux_only: compile and statically inspect; defer Wine/media execution'
        type: boolean
        default: false
      linux_release_tag:
        description: 'Optional new Linux-only prerelease tag, e.g. v0.1.6-linux-amd64'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: wine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          if [ "${{ inputs.compile_only }}" = true ] && [ "${{ inputs.linux_only }}" != true ]; then
            echo 'Select linux_only=true for compile_only builds.' >&2
            exit 1
          fi
          if [ "${{ inputs.compile_only }}" = true ]; then
            python3 -m compileall -q scripts tools/tests
            python3 tools/tests/test_winedmo_seek_generation.py --compile-only
            python3 tools/tests/test_quartz_no_position.py --compile-only
          else
            python3 -m unittest discover -s tools/tests -p 'test_*.py'
          fi
          python3 scripts/release-check.py --public-history
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for file in Path('scripts').rglob('*.py'):
              ast.parse(file.read_text(), filename=str(file))
          PY
          while IFS= read -r file; do bash -n "$file"; done < <(find scripts tools -name '*.sh')

  build:
    needs: source-check
    if: (github.event_name == 'workflow_dispatch' && !inputs.libraries_only && !inputs.linux_only) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ fromJSON(vars.MACOS_BUILD_RUNNER_JSON || '"xcode-27"') }}
    timeout-minutes: 240
    env:
      POC_MACOSX_DEPLOYMENT_TARGET: '27.0'
      POC_JOBS: '4'
      POC_RELEASE_DIR: ${{ github.workspace }}/outputs/release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare hosted runner dependencies
        if: runner.environment == 'github-hosted'
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v pkg-config >/dev/null || brew install pkgconf
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Build macOS 27 Whisky Libraries and verify FFmpeg capabilities
        env:
          POC_WORK_DIR: ${{ runner.temp }}/wine-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/build-release.sh
      - name: Upload distributable archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whisky-libraries
          path: outputs/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-linux:
    needs: source-check
    if: (github.event_name == 'workflow_dispatch' && !inputs.libraries_only) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      compile_only: ${{ inputs.compile_only || false }}
      release_tag: ${{ inputs.linux_release_tag || '' }}

  verify-libraries:
    needs: source-check
    if: github.event_name == 'workflow_dispatch' && inputs.libraries_only
    runs-on: ${{ fromJSON(vars.MACOS_BUILD_RUNNER_JSON || '"xcode-27"') }}
    timeout-minutes: 45
    env:
      POC_MACOSX_DEPLOYMENT_TARGET: '27.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Rosetta
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Package and launch the legacy released runtime (not current codec validation)
        env:
          POC_WORK_DIR: ${{ runner.temp }}/libraries-check-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/ci/verify-libraries.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: whisky-libraries-integration-check
          path: |
            ${{ runner.temp }}/libraries-check-${{ github.run_id }}-${{ github.run_attempt }}/release/*
            ${{ runner.temp }}/libraries-check-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics/*
          compression-level: 0
          if-no-files-found: error


  publish:
    needs: [build, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: whisky-libraries
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wine-linux-amd64
          path: release
      - name: Verify and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-linux-amd64
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; verify its required runtime assets before updating the channel."
            gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '[.assets[] | select(.state == "uploaded") | .name] | contains(["Libraries.tar.gz", "Libraries-sources.tar.gz", "WhiskyWineVersion.plist", "SHA256SUMS", "Libraries-privacy-audit.json", "Libraries-static-check.json", "Libraries-ffmpeg-capabilities.json", "wine-linux-amd64.tar.gz", "wine-linux-amd64-sources.tar.gz", "SHA256SUMS-linux-amd64", "linux-release-manifest.json", "linux-privacy-audit.json", "linux-static-check.json", "linux-ffmpeg-capabilities.json"])' | grep -qx true
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "$RELEASE_TAG — macOS 27+ Apple Silicon (Rosetta) · Linux amd64" \
              --notes-file RELEASE-NOTES.md Libraries.tar.gz Libraries-sources.tar.gz WhiskyWineVersion.plist SHA256SUMS release-manifest.json Libraries-privacy-audit.json Libraries-static-check.json Libraries-ffmpeg-capabilities.json RELEASE-NOTES.md wine-linux-amd64.tar.gz wine-linux-amd64-sources.tar.gz SHA256SUMS-linux-amd64 linux-release-manifest.json linux-privacy-audit.json linux-static-check.json linux-ffmpeg-capabilities.json
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          fi
      - name: Refresh the public Wine runtime channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/publish-runtime-channel.py --tag "$RELEASE_TAG"
