name: Build Linux Wine

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      POC_JOBS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/linux/install-deps.sh
      - name: Build shared Wine patch stack for Linux
        env:
          POC_LINUX_WORK_DIR: ${{ runner.temp }}/wine-linux
        run: |
          python3 -m unittest discover -s tools/tests
          python3 scripts/linux/build.py all
          python3 scripts/linux/build-probes.py --work-dir "$POC_LINUX_WORK_DIR"
          LD_LIBRARY_PATH="$POC_LINUX_WORK_DIR/deps/lib" python3 scripts/ci/check-ffmpeg.py \
            --library-dir "$POC_LINUX_WORK_DIR/deps/lib" --output "$POC_LINUX_WORK_DIR/ffmpeg-capabilities.json"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/linux/verify.py --work-dir "$POC_LINUX_WORK_DIR"
          python3 scripts/linux/package.py --work-dir "$POC_LINUX_WORK_DIR" --output outputs/linux
          mv outputs/linux/wine-linux-amd64 "$RUNNER_TEMP/relocated-wine"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 scripts/linux/verify.py \
            --work-dir "$POC_LINUX_WORK_DIR" --runtime "$RUNNER_TEMP/relocated-wine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wine-linux-amd64
          path: outputs/linux/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wine-linux-logs
          path: |
            ${{ runner.temp }}/wine-linux/logs/*
            ${{ runner.temp }}/wine-linux/validation/*/*.log
            ${{ runner.temp }}/wine-linux/validation/*/linux-runtime-check.json
            ${{ runner.temp }}/wine-linux/ffmpeg-capabilities.json
          if-no-files-found: warn
